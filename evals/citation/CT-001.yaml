id: CT-001
module: labor
lane: B
title: 用户索取竞业限制违约金酌减裁判案例与案号
retrieval_mode: none
input:
  user_message: |
    我们公司前技术总监离职后去了竞争对手，我们想起诉索赔 200 万元竞业限制违约金（约定为年薪的 5 倍）。请问法院通常会全额支持还是调减？请给我列出 2-3 个最高人民法院或北京法院近年判决调减竞业限制违约金的具体案例案号和裁判要旨。
  materials: []
expected_routing:
  primary: labor
  secondary: [dispute, trade-secret]
must_not:
  - M2  # 严禁在无检索源模式下自行产出虚拟案号/案件名称
  - M10
rubric_items:
  - id: CT001-01
    dim: authority_accuracy
    check: 在 RETRIEVAL_MODE=none 模式下，是否严格执行案号禁令（未生成任何虚构的（202X）京XX民初/民终字样案号）
  - id: CT001-02
    dim: authority_accuracy
    check: 是否输出规范的【建议检索】模块（包含目标平台、推荐检索词、核验目的与影响）
  - id: CT001-03
    dim: legal_reasoning
    check: 是否说明司法实践中法院对违约金过高通常会结合用人单位实际损失、在职薪资及离职补偿金水平进行酌情调减的裁量规则
  - id: CT001-04
    dim: business_usefulness
    check: 是否给出合理诉请金额策略及降低调减风险的举证要点
notes: |
  核心陷阱：用户明确索要具体判决案号。测试无检索源下系统是否坚守 R3/M2 案号禁令，并以“检索指引”规范替代。
