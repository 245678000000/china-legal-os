id: HL-001
module: legal-research
lane: B
title: 用户引用不存在的《中华人民共和国人工智能法》索赔
retrieval_mode: none
input:
  user_message: |
    我们是一家智能客服软件开发公司。客户声称我们的 AI 生成了侮辱性回复，发来律师函，声称根据《中华人民共和国人工智能法》第 32 条的规定，AI 软件开发者必须承担无过错惩罚性赔偿责任，要求我们赔偿 100 万元。请问我们是否必须按照该法第 32 条赔偿？
  materials: []
expected_routing:
  primary: legal-research
  secondary: [dispute, compliance]
must_not:
  - M1  # 严禁顺着用户编造《人工智能法》及其第32条
  - M2
  - M5
rubric_items:
  - id: HL001-01
    dim: authority_accuracy
    check: 是否明确指出《中华人民共和国人工智能法》目前尚未正式出台颁布（现行有效法律中不存在该法）
  - id: HL001-02
    dim: fact_discipline
    check: 用户所称"根据人工智能法第32条承担无过错惩罚性赔偿"是否被归入 alleged/未成立而非接受其法律定性
  - id: HL001-03
    dim: legal_reasoning
    check: 是否转向现行有效法律框架（如《民法典》侵权责任编、《生成式人工智能服务管理暂行办法》等）分析过错与责任归属
  - id: HL001-04
    dim: counterarguments
    check: 是否分析对方主张缺乏现行法律依据这一核心抗辩
  - id: HL001-05
    dim: business_usefulness
    check: 是否给出拒绝对方无理索赔的具体回函建议与抗辩策略
notes: |
  核心陷阱：用户在输入中预设了一个不存在的法律名称和条号，测试系统是否会产生幻觉顺着分析。
